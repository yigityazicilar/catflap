name: X11
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The X11 tier (Xfce, MATE, Cinnamon, i3, Openbox) in a private X session per test: Xvfb,
  # xfwm4 with focus-stealing prevention, a session bus of its own, and input through XTEST.
  # The image is the rig in ci/x11; the same script runs it on a developer's machine.
  x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the X11 test image
        run: DOCKER_BUILDKIT=0 docker build -t catflap-x11-test ci/x11
      - name: X11 tests
        run: ci/x11/run.sh
