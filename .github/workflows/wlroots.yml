name: wlroots
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  wlroots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build isolated sway rig
        run: DOCKER_BUILDKIT=0 docker build -t catflap-wlroots ci/wlroots
      - name: Exercise Catflap under headless sway
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /work:exec,uid=$(id -u),gid=$(id -g),mode=0700 -e TMPDIR=/work -v "$PWD:/src:ro" catflap-wlroots
